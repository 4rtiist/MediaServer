services:
  db:
    image: postgres:latest
    container_name: media-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: testing
      POSTGRES_DB: media_server_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/MAJOR/docker

volumes:
  pgdata: